# Platform contract for zorc. Memory and node placement come from the deployment report, not from here.
name: sealed-signals
kind: dockerfile
port: 8080
memory_mb: 512

domains:
  - sealed-signals.zaindroid.me

# No database: this pilot keeps its round in process and rebuilds it from engine/seeding.py on start.
# The risk list is read from the committed ACAPS export. Nothing here is a system of record yet, and
# declaring a Postgres we do not use would be worse than saying so.
database: false
redis: false
# The expert card's questions are written by a model when one is reachable (engine/question_gen.py,
# MASTER_PROMPT 6d): the risk's own record, how its band has actually resolved, the severity move
# that fired the pulse, and the expert's region and expertise go in; questions in the deterministic
# bank's own schema come out. It runs when the pulse is created -- analyst-side, so the analyst can
# read what it produced before a link goes out, and the card still opens on a bad connection.
#
# `ai: true` wires LLM_BASE_URL and LLM_API_KEY to the shared zorc gateway, which picks a free
# provider and fails over between them. No provider key is ever held here. Without those vars the
# generator is simply absent and the reviewed sets and deterministic bank answer instead, which is
# why nothing breaks when the gateway is down.
ai: true

dependencies:
  python: "3.12"
  node: "22"

env:
  # Internal secrets. The platform generates these and sets them before the first real start; the
  # engine refuses to boot without them rather than falling back to a default.
  COMMITMENT_SALT:
    generate: hex
  PSEUDONYM_KEY:
    generate: hex
  # Committee key material for the hardening stack (MASTER_PROMPT 6c): the ML-KEM-768 registry
  # key and the ML-DSA-65 attestation key are derived from this one secret under separate labels,
  # so the published key ids survive a restart. Without it the engine derives them from
  # PSEUDONYM_KEY and says so in GET /api/registry/status.
  COMMITTEE_KEY:
    generate: hex
  # Supplied, not generated: this one belongs to an ACAPS account. Leave it unset and the
  # engine serves the cached editions and says so, which is a working state, not a failure.
  ACAPS_API_TOKEN:
    required: false
    secret: true

healthcheck:
  path: /health
  ready_path: /ready
